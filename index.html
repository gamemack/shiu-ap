<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 SHIU-AP • Space Shooter</title>
  <link rel="stylesheet" href="./public.css">
  <style>
    #gameModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center;
    }
    .game-container { position: relative; }
    .close-btn {
      position: absolute; top: -15px; right: -15px; background: #ff4040; color: white;
      width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 20px;
      cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body class="lang-zh">
  <div class="container">
    <header class="header">
      <div class="logo">🚀 SHIU-AP <span style="color:#aaa;font-size:0.7em;">SPACE SHOOTER</span></div>
      <div class="lang-switch">
        <button data-lang="zh" class="active" onclick="switchLang('zh')">中文</button>
        <button data-lang="fa" onclick="switchLang('fa')">فارسی</button>
        <button data-lang="en" onclick="switchLang('en')">English</button>
      </div>
    </header>

    <section style="text-align:center; margin:40px 0;">
      <h1 style="font-size:52px; background:linear-gradient(90deg,#ff4040,#00ccff); -webkit-background-clip:text; color:transparent;">
        SPACE SHOOTER ARENA
      </h1>
    </section>

    <h2 style="text-align:center; margin:30px 0; font-size:28px;">🎯 بازی‌های موجود</h2>
    <div id="gameGrid" class="game-grid"></div>

    <!-- Modal بازی -->
    <div id="gameModal">
      <div class="game-container">
        <button class="close-btn" onclick="closeGame()">✕</button>
        <div class="header-game" style="background:#111; padding:10px; border-bottom:2px solid #ff4040;">
          <h2 id="modalTitle" style="margin:0; color:#ff4040;">SPACE SHOOTER</h2>
        </div>
        <canvas id="gameCanvas" width="480" height="640" style="display:block; margin:0 auto; border:3px solid #ff4040; box-shadow:0 0 40px #ff4040;"></canvas>
      </div>
    </div>

    <!-- بخش کامنت و آپلود (همان قبلی) -->
    <div id="commentSection" class="comment-section">...</div>
    <div class="upload-area">...</div>

    <footer style="text-align:center; margin-top:60px; color:#555;">
      © 2026 SHIU-AP • Powered by Mehdi Jahaan 🚀
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
